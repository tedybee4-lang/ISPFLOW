name: ISPFlow backend CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ispbilling_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ispbilling_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci-only-password@127.0.0.1:55432/ispbilling_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-only-password@127.0.0.1:55432/ispbilling_test
      REDIS_URL: redis://127.0.0.1:6379/1
      CELERY_BROKER_URL: redis://127.0.0.1:6379/2
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/3
      SECRET_KEY: ci-only-secret-not-for-deployment
      MPESA_CONSUMER_KEY: ci-only-consumer-key
      MPESA_CONSUMER_SECRET: ci-only-consumer-secret
      MPESA_PASSKEY: ci-only-passkey
      MPESA_SHORTCODE: "123456"
      MPESA_CALLBACK_URL: https://example.invalid/callback
      MPESA_ENVIRONMENT: sandbox

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate migration graph
        run: alembic heads

      - name: Apply migrations to disposable CI database
        run: alembic upgrade head

      - name: Run backend test suite
        run: python -m pytest tests/ -q
