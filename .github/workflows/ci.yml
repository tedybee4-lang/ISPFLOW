name: ISPFlow CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ispbilling_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ispbilling_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: isp-billing-backend-master
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci-only-password@127.0.0.1:55432/ispbilling_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-only-password@127.0.0.1:55432/ispbilling_test
      REDIS_URL: redis://127.0.0.1:6379/1
      CELERY_BROKER_URL: redis://127.0.0.1:6379/2
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/3
      SECRET_KEY: ci-only-secret-not-for-deployment
      MPESA_CONSUMER_KEY: ci-only-consumer-key
      MPESA_CONSUMER_SECRET: ci-only-consumer-secret
      MPESA_PASSKEY: ci-only-passkey
      MPESA_SHORTCODE: "123456"
      MPESA_CALLBACK_URL: https://example.invalid/callback
      MPESA_ENVIRONMENT: sandbox

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: isp-billing-backend-master/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: isp-billing-frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate safe local configuration template
        run: |
          python - <<'PY'
          from pathlib import Path
          from sqlalchemy.engine import make_url

          values = {}
          for line in Path("env.example").read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if line and not line.startswith("#") and "=" in line:
                  key, value = line.split("=", 1)
                  values[key] = value.strip().strip('"')

          database = make_url(values["DATABASE_URL"])
          assert values["HOST"] == "127.0.0.1"
          assert database.host == "127.0.0.1" and database.port == 55432
          assert database.get_backend_name() == "postgresql"
          def is_placeholder(value):
              return any(
                  marker in value.lower()
                  for marker in ("replace", "change", "your-", "placeholder", "example")
              )

          assert is_placeholder(values["GLOBAL_ADMIN_PASSWORD"])
          assert is_placeholder(values["SECRET_KEY"])
          router_password = values["MIKROTIK_DEFAULT_PASSWORD"].lower()
          assert not router_password or is_placeholder(router_password)

          ignore_rules = set(Path("../.gitignore").read_text(encoding="utf-8").splitlines())
          assert {".env", "**/.env", "**/.env.*", "*.pem", "*.key", "*.dump", "*.sql"} <= ignore_rules
          PY

      - name: Compile backend Python
        run: python -m compileall -q app tests

      - name: Validate migration graph
        run: alembic heads

      - name: Apply migrations to disposable CI database
        run: alembic upgrade head

      - name: Validate Docker entrypoint shell syntax
        run: sh -n docker/entrypoint.sh

      - name: Run backend test suite
        run: python -m pytest tests/ -q

      - name: Install frontend dependencies
        working-directory: isp-billing-frontend
        run: npm ci

      - name: Build frontend
        working-directory: isp-billing-frontend
        run: npm run build
