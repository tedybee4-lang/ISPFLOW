name: ISPFlow production deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ispflow-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: isp-billing-frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: isp-billing-backend-master
        run: python -m pip install -r requirements.txt

      - name: Compile backend Python
        working-directory: isp-billing-backend-master
        run: python -m compileall -q app tests

      - name: Validate migration graph
        working-directory: isp-billing-backend-master
        run: alembic heads

      - name: Install frontend dependencies and build
        working-directory: isp-billing-frontend
        run: |
          npm ci
          npm run build
          test -s dist/index.html

      - name: Configure SSH
        run: |
          install -m 600 /dev/null ~/.ssh/ispflow_deploy_key
          printf '%s\n' "${{ secrets.VPS_DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/ispflow_deploy_key
          chmod 600 ~/.ssh/ispflow_deploy_key
          printf '%s\n' "${{ secrets.VPS_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy frontend
        run: |
          scp -i ~/.ssh/ispflow_deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -P "${{ vars.VPS_SSH_PORT }}" -r isp-billing-frontend/dist/. "${{ vars.VPS_DEPLOY_USER }}@${{ vars.VPS_SSH_HOST }}:/var/www/ispflow/"

      - name: Deploy backend and restart services
        run: |
          ssh -i ~/.ssh/ispflow_deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "${{ vars.VPS_SSH_PORT }}" "${{ vars.VPS_DEPLOY_USER }}@${{ vars.VPS_SSH_HOST }}" <<'REMOTE'
          set -euo pipefail
          cd /opt/ispflow/src
          PREV_COMMIT="$(git rev-parse HEAD)"
          echo "$PREV_COMMIT" > /tmp/ispflow-previous-commit
          git fetch origin main
          git reset --hard origin/main
          /opt/ispflow/venv/bin/pip install -r /opt/ispflow/src/isp-billing-backend-master/requirements.txt
          cd /opt/ispflow/src/isp-billing-backend-master
          /opt/ispflow/venv/bin/python -m alembic upgrade head
          sudo systemctl restart ispflow-backend.service
          sudo systemctl restart ispflow-celery-worker.service
          sudo systemctl restart ispflow-celery-beat.service
          for attempt in $(seq 1 15); do
            if curl -fsS https://api.ispflow.co.ke/health >/dev/null; then
              echo "HEALTH_OK"
              exit 0
            fi
            sleep 2
          done
          echo "HEALTH_CHECK_FAILED"
          git reset --hard "$PREV_COMMIT"
          sudo systemctl restart ispflow-backend.service
          sudo systemctl restart ispflow-celery-worker.service
          sudo systemctl restart ispflow-celery-beat.service
          exit 1
          REMOTE

      - name: Verify deployment
        run: |
          curl -fsS https://ispflow.co.ke >/dev/null
          curl -fsS https://api.ispflow.co.ke/health
          ssh -i ~/.ssh/ispflow_deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "${{ vars.VPS_SSH_PORT }}" "${{ vars.VPS_DEPLOY_USER }}@${{ vars.VPS_SSH_HOST }}" "git -C /opt/ispflow/src rev-parse HEAD"
